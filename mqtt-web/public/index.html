<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail RickLab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="startScreen">
        <button id="startButton">🔊 ACTIVER LE PORTAIL</button>
    </div>

    <video id="backgroundVideo" playsinline></video>

    <script>
        const ws = new WebSocket("ws://172.16.89.41:3000");

        const video = document.getElementById("backgroundVideo");
        const startScreen = document.getElementById("startScreen");
        const startButton = document.getElementById("startButton");

        let audioAutorise = false;

        // Première interaction utilisateur
        startButton.addEventListener("click", async () => {

            audioAutorise = true;

            startScreen.style.display = "none";

            console.log("🔊 Son autorisé");

            // On lance brièvement la vidéo avec le son
            // pour débloquer l'audio du navigateur
            video.muted = false;

            try {
                await video.play();
                video.pause();

                console.log("Audio débloqué !");
            } catch (error) {
                console.log("Préparation audio :", error);
            }
        });


        // Connexion WebSocket
        ws.onopen = () => {
            console.log("WebSocket connecté");
        };


        // Réception MQTT via WebSocket
        ws.onmessage = (event) => {

            console.log("Message reçu :", event.data);

            const data = JSON.parse(event.data);

            const nomVideo = data.message.trim() + ".mp4";
            const urlVideo = "/media/" + encodeURIComponent(nomVideo);

            console.log("🎬 Vidéo :", urlVideo);

            video.src = urlVideo;
            video.muted = !audioAutorise;

            video.load();

            video.play()
                .then(() => {
                    console.log("▶️ Vidéo lancée");

                    if (audioAutorise) {
                        console.log("🔊 Avec son");
                    } else {
                        console.log("🔇 Sans son");
                    }
                })
                .catch(error => {
                    console.error("❌ Impossible de lancer la vidéo :", error);
                });
        };


        ws.onerror = (error) => {
            console.error("Erreur WebSocket :", error);
        };
    </script>

</body>
</html>
