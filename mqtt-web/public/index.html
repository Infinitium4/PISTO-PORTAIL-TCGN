<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail RickLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="backgroundVideo" autoplay playsinline></video>

    <script>
        const ws = new WebSocket("ws://172.16.89.41:3000");

        const video = document.getElementById("backgroundVideo");

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const message = JSON.parse(data.message);

            console.error("Received data:", data);
            console.error("Received message:", message);

            if (message.action === "portail") {

                const nomVideo = message.dimension.trim() + ".mp4";

                video.src = "/mqtt-web/public/media/" + encodeURIComponent(nomVideo);
                video.load();
                video.play().catch(error => {
                    video.src = "/mqtt-web/public/media/error.mp4";
                    video.load();
                });
            }

            if (message.action === "wiki"){
                window.location.href = "/mqtt-web/public/planete.php?nom=" + encodeURIComponent(message.dimension);
            }
        };

    </script>
</body>
</html>
